# Publishes Shipfront Terminal to GitHub Pages via the gh-pages branch.
#
# Why a branch and not the Pages API
# ---------------------------------
# actions/configure-pages@v5 with enablement fails here: creating a Pages site
# calls an endpoint that requires repository admin, and the workflow token is
# not an admin. Pushing a branch is within the token's rights, so the built
# site goes to gh-pages and the legacy branch source serves it. Nothing in
# Settings has to be touched by this workflow.
#
# Turning Pages on is still a one time manual step: Settings, Pages, Source
# "Deploy from a branch", branch gh-pages, folder / (root).
#
# What is gated, and what is not
# ------------------------------
# The binary assets are byte locked. The truck JPEG is a shared Shipfront asset
# and the four woff2 faces are the exact Google Fonts payloads, so any change to
# their bytes is a corruption rather than an edit and the build refuses to ship.
# They are pinned by hash below.
#
# The HTML, CSS, and JavaScript are source. They are checked against the Friday
# Terminal lock: black, white, cube, one accent. Orange #FF6A00 only on the
# wordmark bar and Get a Quote. The stills are not regenerated.

name: Publish Terminal

on:
  push:
    branches: [claw]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the byte locked assets
        run: |
          set -euo pipefail

          echo "01268520751d59bf9762d2d7d7c3e1555ba60c8d  images/logistics.jpg" | sha1sum -c -

          size=$(stat -c%s images/logistics.jpg)
          if [ "$size" -ne 376501 ]; then
            echo "::error::truck JPEG is $size bytes, expected 376501"
            exit 1
          fi

          sha256sum -c - <<'SUMS'
          b01f32be4f626f47d78c3c7c186c46ae0d6a804a23912b8d259edaf24da00666  images/logistics.jpg
          0640890476fc1198ab4de571fb658de443c4d85b66466ec09534a8737ab1ce9d  fonts/space-grotesk-var-latin.woff2
          952dddb45d2f96f71cbf3b7f510b24379afc3c89ea02fcf89d377b45d62c0166  fonts/space-grotesk-var-latin-ext.woff2
          83c005d49d8a6a50474c73a5a36ac0468076e9c4a29da7bdb14995d80560a5be  fonts/jetbrains-mono-var-latin.woff2
          db5ff4db83e580426280e9337a58dc57d3a83784a1b03ad80914651594441d52  fonts/jetbrains-mono-var-latin-ext.woff2
          SUMS

          echo "byte locks hold"

      - name: Assert the design lock still holds
        run: |
          set -euo pipefail

          pages="index.html quote.html contact.html"
          source_files="$pages css/press.css js/press.js favicon.svg"

          fail=0
          bad() { echo "::error::$1"; fail=1; }

          # Three pages, no more.
          for page in $pages; do
            test -s "$page" || bad "$page is missing or empty"
          done
          extra=$(ls -1 *.html | grep -vx -e index.html -e quote.html -e contact.html || true)
          if [ -n "$extra" ]; then
            bad "unexpected page(s): $(echo "$extra" | tr '\n' ' ')"
          fi

          grep -q 'You Sell.' index.html || bad "Home lost 'You Sell.'"
          grep -q 'We Ship.'  index.html || bad "Home lost 'We Ship.'"

          for thing in Warehousing Fulfillment 'eCommerce Integrations' Location; do
            grep -q "$thing" index.html || bad "Home lost '$thing'"
          done
          if grep -q 'role="tab' $pages; then
            bad "found role=tab, the four things are never tabs"
          fi

          for field in 'name="name"' 'name="email"' 'name="company"'; do
            grep -q "$field" quote.html || bad "quote form lost $field"
          done
          grep -q 'No phone number' quote.html || bad "quote page lost the no phone line"
          if grep -riE 'href="tel:' $pages; then
            bad "found a telephone link, this site has no phone number"
          fi
          if grep -riE 'name="phone"|type="tel"|autocomplete="tel"' $pages; then
            bad "found a phone field, the form is Name, Email, Company only"
          fi

          for page in $pages; do
            grep -q '1933 S. Broadway' "$page" || bad "$page lost the street address"
            grep -q '90007' "$page" || bad "$page lost the zip"
            grep -q 'The Reef' "$page" || bad "$page lost The Reef as an address"
            grep -q 'mailto:info@myshipfront.com' "$page" || bad "$page lost the mailto"
            grep -q 'Built by David T Phung' "$page" || bad "$page lost the footer credit"
          done

          # Kunal hex + inner Y, stem down. Fill #000. Square caps, miter.
          # Not a pip. Not 32x36 / M16 3.2.
          for file in $pages favicon.svg; do
            grep -q '40,14' "$file" || bad "$file lost the Kunal cube top"
            grep -q '40,66' "$file" || bad "$file lost the Kunal Y stem"
            grep -q 'fill="#000"' "$file" || bad "$file lost the cube fill #000"
            grep -q 'stroke-linecap="square"' "$file" || bad "$file lost square caps"
            grep -q 'stroke-linejoin="miter"' "$file" || bad "$file lost miter joins"
          done
          if grep -nE 'viewBox="0 0 32 36"|M16 3\.2' $pages favicon.svg; then
            bad "found the rejected 32x36 / M16 3.2 cube"
          fi

          grep -qi 'ff6a00' css/press.css || bad "lost the #FF6A00 accent token"
          grep -qi -- '--ground: #000000' css/press.css || bad "lost the black ground"
          grep -qi -- '--ink: #ffffff' css/press.css || bad "lost the white type"

          primary=$(awk '/^\.btn--signal \{/,/^\}/' css/press.css)
          if ! printf '%s' "$primary" | grep -q 'color: var(--cta-ink)'; then
            bad "the primary button must set #000 on the accent"
          fi
          if printf '%s' "$primary" | grep -q 'color: var(--ink)'; then
            bad "the primary button is #000 on the accent, never white on orange"
          fi
          if ! printf '%s' "$primary" | grep -q 'background: var(--accent)'; then
            bad "the primary button must fill with the accent"
          fi

          bar=$(awk '/^\.wordmark-bar \{/,/^\}/' css/press.css)
          if ! printf '%s' "$bar" | grep -q 'background: var(--accent)'; then
            bad "the wordmark bar must carry the accent"
          fi

          # Accent is reserved. CSS may name --accent only for the bar and CTA.
          accent_uses=$(grep -n 'var(--accent)' css/press.css | grep -v '^[[:space:]]*/\*' || true)
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              *wordmark-bar*|*btn--signal*|*--accent:*|*background: var(--accent)*|*border-color: var(--accent)*) ;;
              *)
                # Allow the two legal rule bodies already checked above.
                num=${line%%:*}
                nearby=$(awk -v n="$num" 'NR>=n-8 && NR<=n {print}' css/press.css)
                if ! printf '%s' "$nearby" | grep -qE 'wordmark-bar|btn--signal'; then
                  bad "accent leaked at css/press.css:$line"
                fi
                ;;
            esac
          done <<< "$accent_uses"

          if grep -riE 'FDA|WMS|temperature-control|temperature control' $pages; then
            bad "found a forbidden product claim"
          fi

          if grep -rlP '\x{2014}|\x{2013}' $source_files; then
            bad "found an em or en dash in the site"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::the design lock was broken, refusing to publish"
            exit 1
          fi

          echo "all locks hold"

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html quote.html contact.html favicon.svg _site/
          cp -r css js fonts images _site/
          touch _site/.nojekyll
          find _site -type f | sort

      - name: Push to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _site
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish Terminal from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "pushed $(git rev-parse --short HEAD) to gh-pages"
